<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">KNOuX — Engineering Digital Systems</title>
  <desc id="desc">A graphite-black architectural hero with platinum typography, precise violet signal lines, and a spatial map of KNOuX's eight divisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090D"/><stop offset=".56" stop-color="#11131B"/><stop offset="1" stop-color="#08090E"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF"/><stop offset=".52" stop-color="#D8D9E4"/><stop offset="1" stop-color="#A6A7BA"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B8A0FF"/><stop offset=".5" stop-color="#8258EA"/><stop offset="1" stop-color="#4D2A9E"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7854D3" stop-opacity=".22"/><stop offset="1" stop-color="#7854D3" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" stroke="#9A92B9" stroke-width=".65" fill="none" opacity=".095"/></pattern>
    <clipPath id="frame"><rect width="1600" height="640" rx="20"/></clipPath>
  </defs>

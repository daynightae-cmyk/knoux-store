<!DOCTYPE html>
<html>
<head>
  <title>A quite room by Ingo Jang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/kiw1rkd.css">
  <style>
    * { margin: 0; padding: 0; outline: none !important; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body, canvas, button { cursor: none !important; }
    canvas { display: block; outline: none !important; }
    #canvas { position: absolute; top: 0; left: 0; }

    /* ── Custom cursor ── */
    #cursor-glow,
    #cursor-dot {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 100;
      transition: opacity 0.16s ease, transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, filter 0.18s ease;
      will-change: transform, opacity;
    }
    #cursor-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 244, 220, 0.92) 0%, rgba(255, 231, 176, 0.54) 34%, rgba(255, 208, 132, 0.22) 58%, rgba(255, 194, 112, 0.04) 76%, rgba(255, 194, 112, 0) 100%);
      filter: blur(0.7px);
      transform: translate(-50%, -50%) scale(1);
    }
    #cursor-glow {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 223, 154, 0.24) 0%, rgba(255, 210, 132, 0.14) 28%, rgba(255, 197, 118, 0.07) 52%, rgba(255, 188, 106, 0.02) 72%, rgba(255, 188, 106, 0) 100%);
      filter: blur(9px);
      transform: translate(-50%, -50%) scale(0.62);
      isolation: isolate;
    }
    #cursor-glow::before,
    #cursor-glow::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      opacity: 0;
      background:
        radial-gradient(circle, rgba(255, 242, 210, 0.20) 0%, rgba(255, 221, 162, 0.10) 18%, rgba(255, 204, 132, 0.04) 36%, rgba(255, 190, 112, 0.015) 54%, rgba(255, 186, 108, 0) 72%);
      filter: blur(7px);
      transform: scale(0.18);
      transform-origin: 50% 50%;
    }
    body.cursor-visible #cursor-dot,
    body.cursor-visible #cursor-glow {
      opacity: 1;
    }
    body.cursor-hover #cursor-dot {
      background: radial-gradient(circle, rgba(255, 248, 230, 0.98) 0%, rgba(255, 236, 194, 0.72) 30%, rgba(255, 214, 146, 0.34) 55%, rgba(255, 196, 112, 0.10) 76%, rgba(255, 196, 112, 0) 100%);
      filter: blur(1.2px);
      transform: translate(-50%, -50%) scale(1.7);
    }
    body.cursor-hover #cursor-glow {
      opacity: 0.96;
      filter: blur(12px);
      transform: translate(-50%, -50%) scale(1.34);
    }
    body.cursor-hover #cursor-glow::before {
      animation: cursorWavePulse 1.55s cubic-bezier(0.2, 0.62, 0.22, 1) infinite;
    }
    body.cursor-hover #cursor-glow::after {
      animation: cursorWavePulse 1.55s cubic-bezier(0.2, 0.62, 0.22, 1) 0.7s infinite;
    }
    @keyframes cursorWavePulse {
      0% {
        opacity: 0;
        transform: scale(0.16);
      }
      18% {
        opacity: 0.95;
      }
      52% {
        opacity: 0.26;
      }
      100% {
        opacity: 0;
        transform: scale(1.85);
      }
    }
    @media (pointer: coarse) {
      #cursor-glow,
      #cursor-dot {
        display: none;
      }
      body, canvas, button {
        cursor: auto !important;
      }
    }

    /* ── Object card ── */
    #object-card {
      font-family: 'Inter', sans-serif;
      position: fixed;
      right: 22px;
      top: 50%;
      transform: translateY(-50%) translateX(14px);
      width: 210px;
      background: rgba(14, 11, 8, 0.76);
      border: 1px solid rgba(180, 155, 90, 0.13);
      border-radius: 3px;
      padding: 18px 17px 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 10;
    }
    #object-card.visible {
      opacity: 1;
      pointer-events: all;
      transform: translateY(-50%) translateX(0px);
    }
    #card-title {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: rgba(200, 172, 108, 0.7);
      margin-bottom: 10px;
    }
    #card-memory {
      font-size: 12px;
      font-weight: 300;
      line-height: 1.7;
      color: rgba(210, 205, 193, 0.62);
      margin-bottom: 16px;
      border-top: 1px solid rgba(180, 155, 90, 0.08);
      padding-top: 10px;
    }
    #card-status {
      min-height: 18px;
      margin: -4px 0 12px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: rgba(204, 182, 126, 0.58);
      transition: color 0.22s ease, opacity 0.22s ease;
    }
    #card-status:empty {
      display: none;
    }
    #object-card.armed {
      border-color: rgba(202, 176, 112, 0.24);
      box-shadow: 0 0 0 1px rgba(202, 176, 112, 0.04);
    }
    #object-card.armed #card-status {
      color: rgba(219, 196, 136, 0.86);
    }
    #card-action {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid rgba(180, 155, 90, 0.2);
      border-radius: 2px;
      color: rgba(200, 175, 115, 0.75);
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: 0.07em;
      padding: 7px 0;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      margin-bottom: 9px;
    }
    #card-action:hover:not(:disabled) {
      border-color: rgba(200, 175, 115, 0.38);
      color: rgba(220, 195, 135, 0.95);
    }
    #card-action:disabled {
      opacity: 0.3;
      cursor: default;
    }
    #card-back {
      display: block;
      width: 100%;
      background: transparent;
      border: none;
      color: rgba(150, 140, 125, 0.38);
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.07em;
      padding: 3px 0;
      cursor: pointer;
      transition: color 0.2s;
      text-align: center;
    }
    #card-back:hover {
      color: rgba(185, 170, 148, 0.62);
    }

    /* ── Hint ── */
    #hint {
      font-family: 'Inter', sans-serif;
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.09em;
      color: rgba(180, 165, 140, 0.28);
      pointer-events: none;
      transition: opacity 0.6s;
    }

    /* ── Timed game UI ── */
    .screen-overlay {
      font-family: 'Inter', sans-serif;
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(8, 7, 6, 0.62);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 30;
    }
    .screen-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }
    .overlay-panel {
      width: min(100%, 420px);
      background: rgba(14, 11, 8, 0.72);
      border: 1px solid rgba(180, 155, 90, 0.12);
      border-radius: 4px;
      padding: 24px 22px 20px;
      text-align: center;
      color: rgba(216, 208, 195, 0.78);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.24);
    }
    .overlay-copy {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.9;
      white-space: pre-line;
    }
    .overlay-question {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.9;
      color: rgba(221, 213, 200, 0.84);
    }
    .overlay-action {
      margin-top: 18px;
      width: 100%;
      background: transparent;
      border: 1px solid rgba(180, 155, 90, 0.22);
      border-radius: 2px;
      color: rgba(205, 183, 125, 0.82);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      padding: 10px 12px;
      transition: border-color 0.2s, color 0.2s, opacity 0.2s;
    }
    .overlay-action:hover:not(:disabled) {
      border-color: rgba(205, 183, 125, 0.4);
      color: rgba(225, 205, 150, 0.96);
    }
    .overlay-action:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .overlay-input {
      margin-top: 16px;
      width: 100%;
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(180, 155, 90, 0.16);
      border-radius: 2px;
      padding: 11px 12px;
      color: rgba(225, 219, 208, 0.9);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 300;
      text-align: center;
    }
    .overlay-input::placeholder {
      color: rgba(182, 171, 150, 0.44);
    }
    .overlay-result {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: rgba(214, 206, 191, 0.82);
    }
    .end-overlay {
      background: rgba(7, 6, 5, 0.78);
      z-index: 34;
    }
    .end-panel {
      width: min(100%, 360px);
      background: rgba(13, 11, 9, 0.82);
      border: 1px solid rgba(180, 155, 90, 0.12);
      border-radius: 4px;
      padding: 28px 24px 22px;
      text-align: center;
      color: rgba(220, 212, 198, 0.82);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }
    .end-title {
      font-size: 24px;
      font-weight: 300;
      line-height: 1.6;
      color: rgba(223, 216, 203, 0.9);
    }
    .end-subtitle {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 300;
      line-height: 1.8;
      color: rgba(205, 196, 181, 0.72);
      white-space: pre-line;
    }
    .end-subtitle:empty {
      display: none;
    }
    #game-restart {
      display: none;
      margin: 18px auto 0;
      max-width: 168px;
    }
    .room-hud {
      font-family: 'Inter', sans-serif;
      position: fixed;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      z-index: 12;
    }
    .room-hud.visible {
      opacity: 1;
    }
    #room-title {
      top: 18px;
      left: 20px;
      font-size: 24px;
      font-family: "overtime-lcd-pro", sans-serif;
      font-weight: 700;
      font-style: normal;
      letter-spacing: 0.06em;
      color: rgba(220, 214, 202, 0.52);
    }
    #room-timer {
      right: 20px;
      bottom: 20px;
      font-size: 20px;
      font-family: "overtime-lcd-pro", sans-serif;
      font-weight: 700;
      font-style: normal;
      letter-spacing: 0.08em;
      color: rgba(220, 214, 202, 0.56);
    }
    .intro-title {
      margin-bottom: 18px;
      font-size: 24px;
      font-family: "overtime-lcd-pro", sans-serif;
      font-weight: 700;
      font-style: normal;
      letter-spacing: 0.08em;
      color: rgba(220, 214, 202, 0.68);
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="cursor-glow"></div>
  <div id="cursor-dot"></div>

  <div id="game-intro" class="screen-overlay visible">
    <div class="overlay-panel">
      <div class="intro-title">A quite room</div>
      <div class="overlay-copy">You have 1 minute.

Look around the room.
Nothing will be explained.

When time is up,
answer one question.

One word.</div>
      <button id="game-start" class="overlay-action">Begin</button>
    </div>
  </div>

  <div id="room-title" class="room-hud">A quiet room</div>
  <div id="room-timer" class="room-hud">01:00</div>

  <div id="game-question" class="screen-overlay">
    <div class="overlay-panel">
      <div class="overlay-copy">Time's up.

Now, answer this.</div>
      <div class="overlay-question">With a $5,000 prize,<br>what will the owner of this room do?</div>
      <input id="game-answer" class="overlay-input" type="text" maxlength="32" placeholder="Type one word" autocomplete="off" spellcheck="false">
      <button id="game-submit" class="overlay-action">Submit</button>
    </div>
  </div>

  <div id="game-outcome" class="screen-overlay end-overlay">
    <div class="end-panel">
      <div id="game-result" class="end-title"></div>
      <div id="game-result-subtitle" class="end-subtitle"></div>
      <button id="game-restart" class="overlay-action">Restart</button>
    </div>
  </div>

  <!-- Object card -->
  <div id="object-card">
    <div id="card-title"></div>
    <p id="card-memory"></p>
    <div id="card-status"></div>
    <button id="card-action"></button>
    <button id="card-back">← Back to desk</button>
  </div>

  <!-- Hover hint -->
  <div id="hint">click once to focus, click again to interact</div>

  <script type="module" src="./scene.js"></script>
</body>
</html>

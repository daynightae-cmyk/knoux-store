name: Verification

# One workflow, three jobs, and a deliberate split of what blocks a merge from
# what merely informs.
#
# `verify` is the merge gate: install, lint, typecheck, build, unit tests,
# coverage, dependency audit and dead-code analysis. It must be green before a
# change lands, and it runs on every push and pull request.
#
# `browser` proves the things a build cannot: that the routes render, that they
# do not overflow at any supported width, and that an automated accessibility
# pass finds no violation on the representative surfaces. It runs against a
# production build, not a dev server.
#
# `sast` is CodeQL. It is GitHub's own static analysis for JavaScript and
# TypeScript and needs no extra tool to be trustworthy. It is reported
# separately from `verify` because its findings arrive as alerts rather than as
# a job status, and a red alert must not be mistaken for a red build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A stale run for the same ref is worthless once the commit moves on.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Each job that needs more says so explicitly, and
# nothing needs more here: the gate reads the repository and nothing else.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Lint, types, build, tests, coverage, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Pinned to a commit, not a tag. A tag is a mutable pointer, and this
      # workflow runs with the repository's token; a moved tag would be someone
      # else's code executing here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Signal artifact path boundaries
        run: |
          python3 -m venv .venv-signal-boundary
          .venv-signal-boundary/bin/python -m pip install PyYAML==6.0.3
          .venv-signal-boundary/bin/python -m unittest scripts.signal.test_path_guard

      - name: Coverage
        run: npm run test:coverage

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Keep the full tree visible without blocking production on advisories
      # that affect development-only tooling and have no upstream patch yet.
      - name: Development/tooling dependency audit
        continue-on-error: true
        run: npm run audit:deps

      - name: Dead code and dependency graph
        run: npm run audit:dead

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Routes, responsive geometry and automated accessibility
    runs-on: ubuntu-latest
    # Sized from what the suite actually costs, not from a round number.
    #
    # This was 25 minutes against a suite that takes 32.4 minutes locally on a
    # warm build with a real GPU. A job that is killed at its own timeout
    # reports `exit code 1` with no failing assertion and still uploads its
    # 198 MB evidence artifact, because the upload is `if: always()`. That is
    # indistinguishable from a real failure in the run list, so the timeout
    # cannot be the thing that reports it.
    #
    # The budget is 3x the measured cost: `fullyParallel: false, workers: 1`
    # means the three viewport projects run in series, `routes.spec.ts` is the
    # slow file in all three (9.2m / 8.7m / 6.2m), and the evidence pass takes
    # 33 screenshots per width. GitHub runners are slower than the workstation
    # that produced those numbers, and `next start` is cold here.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Assertions run against a production build. A dev server compiles routes
      # on demand, serves unbundled modules and adds HMR, so it cannot be used
      # to claim anything about what a visitor receives.
      - run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end, responsive and accessibility checks
        run: npm run test:e2e

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: route-captures
          path: |
            references/visual-audit/closure/
            references/build-cinematic/qa/
            references/build-connected/qa/
          if-no-files-found: ignore
          retention-days: 7

  sast:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required for the security-events API. Scoped to this repository only.
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialise CodeQL
        uses: github/codeql-action/init@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          category: /language:javascript-typescript

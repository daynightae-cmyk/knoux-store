version: "1.1.0"
last_review: "2026-09-29"

global:
  user_agent: "KNOuX-Signal/1.1 lawful-data-ingestion"
  rate_limit_rps: 2
  timeout_seconds: 120
  max_retries: 5
  chunk_size_bytes: 65536
  base_dir: "data/signal/raw"
  processed_dir: "data/signal/processed"
  manifests_dir: "data/signal/manifests"

sources:
  - id: google_libphonenumber
    name: "Google libphonenumber"
    status: APPROVED
    enabled: true
    priority: 1
    countries: [GLOBAL]
    publisher: "Google LLC"
    license: "Apache-2.0"
    license_url: "https://www.apache.org/licenses/LICENSE-2.0"
    source_url: "https://github.com/google/libphonenumber"
    mode: library
    download_urls:
      metadata: "https://raw.githubusercontent.com/google/libphonenumber/master/resources/PhoneNumberMetadata.xml"
      carrier_eg: "https://raw.githubusercontent.com/google/libphonenumber/master/resources/carrier/en/20.txt"
      carrier_ae: "https://raw.githubusercontent.com/google/libphonenumber/master/resources/carrier/en/971.txt"
      carrier_sa: "https://raw.githubusercontent.com/google/libphonenumber/master/resources/carrier/en/966.txt"
      carrier_kw: "https://raw.githubusercontent.com/google/libphonenumber/master/resources/carrier/en/965.txt"
      carrier_qa: "https://raw.githubusercontent.com/google/libphonenumber/master/resources/carrier/en/974.txt"
      carrier_bh: "https://raw.githubusercontent.com/google/libphonenumber/master/resources/carrier/en/973.txt"
      carrier_om: "https://raw.githubusercontent.com/google/libphonenumber/master/resources/carrier/en/968.txt"
    contains:
      telecom_metadata: true
      phone_business: false
      phone_person: false

  - id: wikidata_phones
    name: "Wikidata official phone statements"
    status: APPROVED
    enabled: true
    priority: 1
    countries: [EG, AE, SA, KW, QA, BH, OM]
    publisher: "Wikimedia Foundation"
    license: "CC0-1.0"
    license_url: "https://creativecommons.org/publicdomain/zero/1.0/"
    source_url: "https://query.wikidata.org/sparql"
    mode: api
    contains:
      phone_business: true
      phone_person: true
      phone_alias: false
    notes: "Enabled only for bounded country-scoped P1329 acquisition that excludes explicit human items (Q5); validate normalized output before each promotion."

  - id: openstreetmap
    name: "OpenStreetMap public places"
    status: APPROVED
    enabled: true
    priority: 1
    countries: [EG, AE, SA, KW, QA, BH, OM]
    publisher: "OpenStreetMap Foundation / Geofabrik"
    license: "ODbL-1.0"
    license_url: "https://opendatacommons.org/licenses/odbl/1-0/"
    source_url: "https://www.openstreetmap.org"
    mode: bulk_pbf
    download_urls:
      egypt: "https://download.geofabrik.de/africa/egypt-260929.osm.pbf"
      gcc_states: "https://download.geofabrik.de/asia/gcc-states-260929.osm.pbf"
    commercial_use: true
    redistribution: true
    attribution_required: true
    automated_access_allowed: true
    contains:
      phone_business: true
      phone_person: false
    notes: "Geofabrik 2026-09-29 extracts; contributor identity metadata excluded; ODbL attribution required."

  - id: itu_numbering
    name: "ITU national numbering plans"
    status: APPROVED
    enabled: true
    priority: 3
    countries: [EG, AE, SA, KW, QA, BH, OM]
    publisher: "International Telecommunication Union"
    source_url: "https://www.itu.int/oth/T0202"
    mode: document
    download_urls:
      egypt: "https://www.itu.int/dms_pub/itu-t/oth/02/02/T020200003E0004PDFE.pdf"
      uae: "https://www.itu.int/dms_pub/itu-t/oth/02/02/T02020000DC0001PDFE.pdf"
      saudi: "https://www.itu.int/dms_pub/itu-t/oth/02/02/T02020000B70006PDFE.pdf"
      kuwait: "https://www.itu.int/dms_pub/itu-t/oth/02/02/T02020000730012PDFE.pdf"
      qatar: "https://www.itu.int/dms_pub/itu-t/oth/02/02/T02020000AB0002PDFE.pdf"
      bahrain: "https://www.itu.int/dms_pub/itu-t/oth/02/02/T02020000110008PDFE.pdf"
      oman: "https://www.itu.int/dms_pub/itu-t/oth/02/02/T020200009F0009PDFE.pdf"
    automated_access_allowed: true
    redistribution: false
    attribution_required: true
    contains:
      telecom_metadata: true
    notes: "Official free-access ITU numbering-plan PDFs; ingest factual numbering allocations with provenance. Do not redistribute the source PDFs."


version: "1.1.0"
last_review: "2026-09-29"

global:
  user_agent: "KNOuX-Signal/1.1 lawful-data-ingestion"
  rate_limit_rps: 2
  timeout_seconds: 120
  max_retries: 5
  chunk_size_bytes: 65536
  base_dir: "data/signal/raw"
  processed_dir: "data/signal/processed"
  manifests_dir: "data/signal/manifests"

sources:
  - id: google_libphonenumber
    name: "Google libphonenumber"
    status: APPROVED
    enabled: true
    priority: 1
    countries: [GLOBAL]
    publisher: "Google LLC"
    license: "Apache-2.0"
    license_url: "https://www.apache.org/licenses/LICENSE-2.0"
    source_url: "https://github.com/google/libphonenumber"
    mode: library
    contains:
      telecom_metadata: true
      phone_business: false
      phone_person: false

  - id: wikidata_phones
    name: "Wikidata official phone statements"
    status: APPROVED
    enabled: false
    priority: 1
    countries: [EG, AE, SA, KW, QA, BH, OM]
    publisher: "Wikimedia Foundation"
    license: "CC0-1.0"
    license_url: "https://creativecommons.org/publicdomain/zero/1.0/"
    source_url: "https://query.wikidata.org/sparql"
    mode: api
    contains:
      phone_business: true
      phone_person: true
      phone_alias: false
    notes: "Disabled until bounded SPARQL ingestion and privacy review are complete."

  - id: openstreetmap
    name: "OpenStreetMap public places"
    status: APPROVED
    enabled: false
    priority: 1
    countries: [EG, AE, SA, KW, QA, BH, OM]
    publisher: "OpenStreetMap Foundation"
    license: "ODbL-1.0"
    license_url: "https://opendatacommons.org/licenses/odbl/1-0/"
    source_url: "https://www.openstreetmap.org"
    mode: overpass
    contains:
      phone_business: true
      phone_person: false
    notes: "Enable only for bounded business/place queries with attribution."

  - id: itu_numbering
    name: "ITU numbering plans"
    status: APPROVED
    enabled: false
    priority: 3
    countries: [EG, AE, SA, KW, QA, BH, OM]
    publisher: "International Telecommunication Union"
    source_url: "https://www.itu.int"
    mode: document
    contains:
      telecom_metadata: true
    notes: "Reference documents only until reuse terms and extraction are verified."

  - id: dubai_pulse_ded_commerce
    name: "Dubai Pulse DED commerce"
    status: APPROVED
    enabled: false
    priority: 1
    countries: [AE]

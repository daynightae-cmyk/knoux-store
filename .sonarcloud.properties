# Analyze maintained product/bridge/gateway code. The immutable source references
# are archival inputs and are neither bundled nor executed by the product.
sonar.sources=src,bridge/src,gateway,supabase,scripts,proxy.ts,next.config.mjs
sonar.tests=tests,e2e,bridge/test,scripts/signal/test_path_guard.py,gateway/test_control.py
sonar.exclusions=scripts/signal/test_path_guard.py,gateway/test_control.py
# Literal translation tables repeat syntax by design; CPD ignores the differing
# translated string values. Keep this exemption limited to the authored catalogue.
sonar.cpd.exclusions=src/lib/i18n/site-copy.ts
sonar.sourceEncoding=UTF-8

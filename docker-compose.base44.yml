# Base44 development environment for the KNOuX Digital Headquarters.
# Runs the Next.js dev server from the cloned source with live reload.
services:
  web:
    image: node:24
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_SITE_URL=https://knoux.store
    env_file:
      - /run/base44/app.env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx next dev -H 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
